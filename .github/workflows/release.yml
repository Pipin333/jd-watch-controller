name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build APKs & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APKs (Self-Signed Ready-to-Install)
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/JDWatchController-Watch-${{ github.ref_name }}.apk
          cp myapplication/build/outputs/apk/debug/myapplication-debug.apk release-artifacts/JDWatchController-Phone-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/JDWatchController-Phone-${{ github.ref_name }}.apk
            release-artifacts/JDWatchController-Watch-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
